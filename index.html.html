<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POLA DAN JUJUKAN — Matematik Tingkatan 2</title>
<style>
:root{--purple:#5948d7;--ink:#263451;--bg:#f3f6ff;--green:#0b805d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
main{max-width:850px;margin:0 auto;padding:14px}.hero{background:linear-gradient(130deg,#5142c9,#8b6aef);color:#fff;text-align:center;padding:25px 15px;border-radius:22px}.hero h1{margin:0;font-size:clamp(26px,5vw,38px)}.hero p{margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat,.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 15px #2634510d}.stat{text-align:center}.stat small{display:block;color:#77829b}.stat strong{font-size:21px;color:var(--purple)}.bar{height:9px;background:#dfe4f5;border-radius:9px;overflow:hidden;margin:7px 0 16px}.bar div{height:100%;width:0;background:#38c99d;transition:width .3s}.panel{padding:20px;margin-bottom:15px}.center{text-align:center}h2{margin-top:0}label{display:block;text-align:left;font-weight:750;margin:14px 0 6px}input,select{width:100%;padding:13px;border:2px solid #dce2f4;border-radius:11px;font:inherit;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px 15px;font-weight:750}.primary{background:var(--purple);color:white}.secondary{background:#eceeff;color:#4c40bd}.primary:disabled{opacity:.45;cursor:not-allowed}.full{width:100%;margin-top:15px}.pill{display:inline-block;background:#eeeaff;color:#5142c9;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:850;line-height:1.4;margin:16px 0 8px}.hint{color:#6d7890;font-size:14px}.sequence{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:#f2f4ff;padding:15px;border-radius:13px;margin:14px 0}.term{background:white;border:2px solid #dce2fa;border-radius:10px;padding:9px 12px;color:#4d43b8;font-size:18px;font-weight:850}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.option,.tile{background:white;border:2px solid #e0e5f5;color:#33415c}.option.selected,.tile.selected{border-color:var(--purple);background:#f0edff}.option:disabled,.tile:disabled{cursor:default}.inputrow{display:flex;gap:8px;margin:12px 0}.inputrow input{min-width:0}.feedback{display:none;padding:14px;border-radius:12px;margin-top:14px;line-height:1.55}.feedback.good{display:block;background:#e6fff4;border:1px solid #9be5ca;color:#116b50}.feedback.bad{display:block;background:#fff3e4;border:1px solid #ffd5a4;color:#824a15}.work{background:#ffffffa8;padding:10px;border-radius:9px;margin-top:8px}.zone{display:flex;flex-wrap:wrap;gap:7px;min-height:50px;padding:10px;border:2px dashed #bfc9eb;border-radius:12px;margin:10px 0}.bank{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:#f5f6ff;border-radius:12px}.tile{padding:9px;border-radius:9px}.muted{color:#77829b;font-size:13px}.footer{text-align:center;color:#8490a8;font-size:12px;padding:8px}
@media(max-width:520px){main{padding:9px}.panel{padding:15px}.question{font-size:18px}.options{gap:7px}.option{padding:10px 7px}.stats .stat{padding:9px 3px}.stat strong{font-size:18px}}
</style>
</head>
<body><main>
<header class="hero"><div style="font-size:34px">🔢 ⭐ 🧩</div><h1>POLA DAN JUJUKAN</h1><p>Matematik Tingkatan 2 · Fikir, jawab dan kumpul bintang!</p></header>
<section class="stats"><div class="stat"><small>MARKAH</small><strong id="score">0/36</strong></div><div class="stat"><small>BINTANG</small><strong id="stars">⭐ 0</strong></div><div class="stat"><small>JAWAPAN BETUL</small><strong id="correct">0</strong></div></section>
<div class="muted" id="progressLabel">Sila isi maklumat sebelum bermain</div><div class="bar"><div id="progress"></div></div>
<section id="screen"></section>
<div class="footer">18 soalan · 3 tahap · 2 markah bagi jawapan betul · Jawapan dan jalan kerja dipaparkan selepas setiap percubaan</div>
</main>
<script>
const qs=[
{l:0,t:'choice',q:'Apakah nombor seterusnya?',hint:'Perhatikan perubahan antara nombor.',seq:['2','5','8','11','?'],opts:['12','13','14','15'],a:'14',w:'Setiap nombor bertambah 3. Maka 11 + 3 = 14.'},
{l:0,t:'fill',q:'Lengkapkan jujukan ini.',hint:'Nombor bertambah dengan kadar yang sama.',seq:['4','8','12','16','___'],a:'20',w:'Beza sepunya ialah 4. Sebutan seterusnya = 16 + 4 = 20.'},
{l:0,t:'choice',q:'Apakah peraturan bagi 3, 6, 9, 12, …?',hint:'Bandingkan nombor yang berturutan.',seq:['3','6','9','12'],opts:['Tambah 2','Tambah 3','Tambah 4','Darab 3'],a:'Tambah 3',w:'6 − 3 = 3, 9 − 6 = 3 dan 12 − 9 = 3. Peraturannya ialah tambah 3.'},
{l:0,t:'order',q:'Susun nombor mengikut urutan menaik.',hint:'Tekan kad dalam urutan daripada terkecil kepada terbesar.',seq:['9','3','12','6'],a:['3','6','9','12'],w:'Susunan menaik ialah 3, 6, 9, 12. Beza antara nombor ialah 3.'},
{l:0,t:'drag',q:'Lengkapkan pola nombor.',hint:'Pilih atau seret nombor yang sesuai ke dalam kotak.',seq:['10','20','30','___'],bank:['35','40','45'],a:'40',w:'Pola bertambah 10 setiap kali. 30 + 10 = 40.'},
{l:0,t:'fill',q:'Apakah beza sepunya bagi jujukan ini?',hint:'Cari beza antara dua sebutan berturutan.',seq:['7','11','15','19'],a:'4',w:'11 − 7 = 4, 15 − 11 = 4 dan 19 − 15 = 4.'},
{l:1,t:'choice',q:'Cari sebutan ke-6 bagi 5, 9, 13, 17, …',hint:'Kenal pasti beza sepunya terlebih dahulu.',seq:['5','9','13','17','…'],opts:['21','25','29','33'],a:'25',w:'Beza sepunya = 4. Sebutan ke-5 ialah 21 dan sebutan ke-6 ialah 21 + 4 = 25.'},
{l:1,t:'fill',q:'Cari sebutan ke-8 bagi 2, 5, 8, 11, …',hint:'Gunakan pola tambah yang tetap.',seq:['2','5','8','11','…'],a:'23',w:'Beza sepunya = 3. Sebutan ke-5 = 14, ke-6 = 17, ke-7 = 20 dan ke-8 = 23.'},
{l:1,t:'choice',q:'Apakah peraturan bagi 3, 6, 12, 24, …?',hint:'Perhatikan hubungan darab antara sebutan.',seq:['3','6','12','24'],opts:['Tambah 3','Darab 2','Tambah 6','Darab 3'],a:'Darab 2',w:'3 × 2 = 6, 6 × 2 = 12 dan 12 × 2 = 24. Setiap sebutan didarab 2.'},
{l:1,t:'order',q:'Susun langkah mencari sebutan seterusnya bagi 6, 10, 14, 18, …',hint:'Tekan kad mengikut urutan yang betul.',seq:['6, 10, 14, 18, …'],a:['Cari beza: 10 − 6 = 4','Tambah 4 kepada 18','Jawapan ialah 22'],w:'Beza sepunya = 10 − 6 = 4. Kemudian 18 + 4 = 22. Sebutan seterusnya ialah 22.'},
{l:1,t:'drag',q:'Lengkapkan jujukan darab 3.',hint:'Pilih atau seret nombor yang sesuai.',seq:['2','6','18','___'],bank:['36','45','54'],a:'54',w:'Setiap sebutan didarab 3: 2 × 3 = 6, 6 × 3 = 18, 18 × 3 = 54.'},
{l:1,t:'choice',q:'Jujukan 4, 7, 10, 13, … Apakah sebutan ke-10?',hint:'Sebutan pertama ialah 4 dan beza sepunya ialah 3.',seq:['4','7','10','13','…'],opts:['28','30','31','34'],a:'31',w:'T₁₀ = 4 + (10 − 1) × 3 = 4 + 27 = 31.'},
{l:2,t:'choice',q:'Apakah sebutan ke-12 bagi 7, 12, 17, 22, …?',hint:'Gunakan rumus sebutan ke-n jujukan aritmetik.',seq:['7','12','17','22','…'],opts:['57','62','67','72'],a:'62',w:'a = 7, d = 5. T₁₂ = a + (12 − 1)d = 7 + 11(5) = 62.'},
{l:2,t:'fill',q:'Cari sebutan ke-7 bagi 3, 6, 12, 24, …',hint:'Perhatikan hubungan darab antara sebutan.',seq:['3','6','12','24','…'],a:'192',w:'Setiap sebutan didarab 2. T₅ = 48, T₆ = 96 dan T₇ = 192.'},
{l:2,t:'choice',q:'Jujukan manakah mempunyai beza sepunya 6?',hint:'Bandingkan perubahan antara sebutan.',seq:['Pilih jujukan yang betul'],opts:['2, 8, 14, 20','2, 6, 18, 54','1, 4, 9, 16','5, 10, 20, 40'],a:'2, 8, 14, 20',w:'8 − 2 = 6, 14 − 8 = 6 dan 20 − 14 = 6. Beza sepunya sentiasa 6.'},
{l:2,t:'order',q:'Susun langkah mencari sebutan ke-15 bagi 2, 5, 8, 11, …',hint:'Gunakan rumus Tₙ = a + (n − 1)d.',seq:['Cari T₁₅'],a:['Kenal pasti a = 2 dan d = 3','Gantikan dalam Tₙ = a + (n − 1)d','T₁₅ = 2 + 14(3) = 44'],w:'a = 2, d = 3 dan n = 15. T₁₅ = 2 + (15 − 1) × 3 = 2 + 42 = 44.'},
{l:2,t:'drag',q:'Lengkapkan jujukan kuasa dua.',hint:'Nombor ini ialah hasil darab nombor dengan dirinya.',seq:['1','4','9','16','___'],bank:['20','25','36'],a:'25',w:'1² = 1, 2² = 4, 3² = 9, 4² = 16. Sebutan seterusnya ialah 5² = 25.'},
{l:2,t:'choice',q:'CABARAN KBAT: Sebuah dewan mempunyai 8 kerusi pada baris pertama. Setiap baris berikutnya mempunyai 3 kerusi lebih banyak. Berapakah jumlah kerusi bagi 6 baris pertama?',hint:'Cari bilangan kerusi setiap baris, kemudian jumlahkan semuanya.',seq:['Baris 1: 8','Baris 2: 11','Baris 3: 14','…','Baris 6: ?'],opts:['63 kerusi','78 kerusi','93 kerusi','108 kerusi'],a:'93 kerusi',w:'Bilangan kerusi: 8, 11, 14, 17, 20, 23. Jumlah = 8 + 11 + 14 + 17 + 20 + 23 = 93. Cara lain: jumlah = 6 ÷ 2 × (8 + 23) = 3 × 31 = 93 kerusi.'}
];
let name='',klass='',i=0,score=0,stars=0,correct=0,done=0,attempted=false,order=[],dragValue='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,'');
function stats(){$('score').textContent=score+'/36';$('stars').textContent='⭐ '+stars;$('correct').textContent=correct;$('progress').style.width=(done/18*100)+'%';$('progressLabel').textContent=done+' daripada 18 soalan selesai';}
function welcome(){
$('screen').innerHTML=`<div class="panel"><h2 class="center">🎓 Selamat datang, bakal pakar pola!</h2><p class="center">Masukkan nama dan kelas sebelum memulakan permainan.</p><form id="studentForm"><label for="studentName">Nama murid</label><input id="studentName" required maxlength="80" placeholder="Masukkan nama penuh"><label for="studentClass">Kelas</label><select id="studentClass" required><option value="">-- Pilih kelas --</option><option>2 DINAMIK</option><option>2 EFISIEN</option><option>2 IDEAL</option><option>2 AKTIF</option><option>Kelas lain</option></select><p id="err" style="color:#bd3345"></p><button class="primary full" type="submit">MULAKAN PERMAINAN 🎮</button></form><p class="muted center">3 tahap · 6 soalan setiap tahap · 2 markah bagi setiap jawapan betul</p></div>`;
$('studentForm').onsubmit=e=>{e.preventDefault();name=$('studentName').value.trim();klass=$('studentClass').value;if(!name||!klass){$('err').textContent='Sila lengkapkan nama dan kelas.';return}i=0;score=stars=correct=done=0;stats();render()};
}
function render(){
attempted=false;order=[];dragValue='';const q=qs[i],level=Math.floor(i/6),labels=['Mudah','Sederhana','Sukar'],em=['🌱','⚡','🏆'];
let h=`<div class="panel"><div><span class="pill">${em[level]} Tahap ${level+1} · ${labels[level]}</span><span style="float:right;font-size:12px;color:#77829b">Soalan ${i+1}/18</span></div><p class="muted">👤 ${esc(name)} · ${esc(klass)}</p><div class="question">${esc(q.q)}</div><div class="hint">${esc(q.hint)}</div><div class="sequence">${q.seq.map(s=>`<span class="term">${esc(s)}</span>`).join('')}</div>`;
if(q.t==='choice')h+=`<div class="options">${q.opts.map((o,j)=>`<button class="option" data-val="${esc(o)}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>`;
if(q.t==='fill')h+=`<div class="inputrow"><input id="answer" placeholder="Taip jawapan di sini" aria-label="Jawapan"><button class="primary" id="check">Semak</button></div>`;
if(q.t==='drag')h+=`<p class="muted">Pilih atau seret jawapan ke kotak.</p><div class="zone" id="dropzone">Letakkan jawapan di sini</div><div class="bank">${q.bank.map(v=>`<button class="tile" draggable="true" data-val="${esc(v)}">${esc(v)}</button>`).join('')}</div><button class="primary full" id="checkDrag">Semak jawapan</button>`;
if(q.t==='order')h+=`<p class="muted">Tekan kad mengikut urutan yang betul.</p><div class="zone" id="orderZone">Jawapan anda muncul di sini</div><div class="bank">${q.a.slice().sort(()=>Math.random()-.5).map(v=>`<button class="tile" data-val="${esc(v)}">${esc(v)}</button>`).join('')}</div><button class="secondary" id="clearOrder">Kosongkan</button><button class="primary" id="checkOrder" style="margin-left:7px">Semak susunan</button>`;
h+=`<div class="feedback" id="feedback" aria-live="polite"></div><div id="actions" style="display:flex;gap:8px;margin-top:14px"><button class="secondary" id="menu">Menu utama</button></div></div>`;$('screen').innerHTML=h;
if(q.t==='choice')document.querySelectorAll('.option').forEach(b=>b.onclick=()=>submit(b.dataset.val));
if(q.t==='fill'){$('check').onclick=()=>submit($('answer').value);$('answer').onkeydown=e=>{if(e.key==='Enter')submit($('answer').value)}}
if(q.t==='drag'){const drop=$('dropzone');document.querySelectorAll('.tile').forEach(b=>{b.onclick=()=>{if(!attempted){dragValue=b.dataset.val;drop.textContent=dragValue}};b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.val)});drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();dragValue=e.dataTransfer.getData('text/plain');drop.textContent=dragValue};$('checkDrag').onclick=()=>submit(dragValue)}
if(q.t==='order'){const redraw=()=>{$('orderZone').innerHTML=order.length?order.map((v,j)=>`<button class="tile" data-index="${j}">${j+1}. ${esc(v)} ✕</button>`).join(''):'Jawapan anda muncul di sini';document.querySelectorAll('#orderZone [data-index]').forEach(b=>b.onclick=()=>{if(!attempted){order.splice(+b.dataset.index,1);redraw()}})};document.querySelectorAll('.bank .tile').forEach(b=>b.onclick=()=>{if(!attempted&&!order.includes(b.dataset.val)){order.push(b.dataset.val);redraw()}});$('clearOrder').onclick=()=>{order=[];redraw()};$('checkOrder').onclick=()=>submit(order.slice())}
$('menu').onclick=welcome;stats();
}
function submit(value){
if(attempted)return;const q=qs[i];if(value===null||value===undefined||String(value).trim()===''){return}
const right=Array.isArray(q.a)?Array.isArray(value)&&value.length===q.a.length&&value.every((v,j)=>norm(v)===norm(q.a[j])):norm(value)===norm(q.a);
attempted=true;done++;if(right){score+=2;stars++;correct++}
const fb=$('feedback');fb.className='feedback '+(right?'good':'bad');fb.innerHTML=`<strong>${right?'🎉 Syabas! Betul, +2 markah dan 1 bintang!':'💡 Belum tepat. Markah: 0.'}</strong><div><b>Jawapan:</b> ${Array.isArray(q.a)?q.a.map(esc).join(' → '):esc(q.a)}</div><div class="work"><b>Jalan kerja:</b><br>${esc(q.w)}</div>`;
document.querySelectorAll('#screen button').forEach(b=>{if(!b.closest('#actions'))b.disabled=true});
$('actions').innerHTML=`<button class="secondary" id="menu">Menu utama</button><button class="primary" id="next">${i===17?'Lihat keputusan':'Soalan seterusnya ➜'}</button>`;$('menu').onclick=welcome;$('next').onclick=()=>{if(i<17){i++;render()}else results()};stats();
}
function results(){const pct=Math.round(score/36*100);$('screen').innerHTML=`<div class="panel center"><div style="font-size:55px">${pct>=85?'🏆':pct>=60?'🌟':'💪'}</div><h2>Tahniah, ${esc(name)}!</h2><p>Kelas: ${esc(klass)}</p><div style="font-size:40px;font-weight:900;color:var(--purple)">${score}/36</div><p>${pct}% markah · ${correct}/18 jawapan betul · ⭐ ${stars} bintang</p><p>${pct>=85?'Hebat! Penguasaan anda sangat baik.':pct>=60?'Bagus! Teruskan latihan untuk lebih mahir.':'Teruskan mencuba. Baca jalan kerja dan main semula!'}</p><button class="primary full" id="again">MAIN SEMULA</button><button class="secondary full" id="back">Kembali ke menu</button><p class="muted">Ambil tangkap layar keputusan ini untuk dihantar kepada guru jika diminta.</p></div>`;$('again').onclick=()=>{i=score=stars=correct=done=0;stats();render()};$('back').onclick=welcome;stats()}
welcome();stats();
</script></body></html>
